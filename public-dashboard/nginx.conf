server {
    listen 80;
    server_name raspberry.local;

    # Enable Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;

    # Redirect trailing slashes to URLs without trailing slashes
    rewrite ^/(.*)/$ /$1 permanent;

    # Serve static assets from Nuxt public folder
    location / {
        root /home/pi/projects/microw8/public-dashboard;
        try_files $uri $uri/index.html =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx";
    }

    error_page 404 /404.html;
    location = /404.html {
        root /home/pi/projects/microw8/public-dashboard;
        access_log off;
        internal;
    }

    # Cache static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}